<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>今日打卡</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* 完整对话脚本区域 */
  .dialog-list { max-height: 50vh; overflow-y: auto; padding: 8px 4px; }
  .dialog-line {
    display: flex; gap: 8px; padding: 8px 10px; margin: 6px 0;
    border-radius: 12px; background: #FFF5E1;
    transition: background .2s;
  }
  .dialog-line.playing { background: linear-gradient(135deg, #FFE082, #FFCA28); }
  .dialog-line.done    { opacity: .55; }
  .dialog-line.skipped { opacity: .35; background: #F0F0F0; }
  .dialog-line .role-icon { font-size: 22px; }
  .dialog-line .role-body { flex: 1; }
  .dialog-line .role-name { font-size: 11px; color: #888; }
  .dialog-line .role-en   { font-size: 14px; font-weight: 600; color: #333; }
  .dialog-line .role-zh   { font-size: 12px; color: #666; margin-top: 2px; }
  .listen-ctrl {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap; padding: 6px 0;
  }
  .listen-ctrl .sub-btn { width: auto; padding: 8px 14px; }
  /* 预下载进度条 */
  .prefetch-bar {
    height: 4px; background: #FFF0D0; border-radius: 2px; overflow: hidden;
    margin: 8px 0;
  }
  .prefetch-bar .fill {
    height: 100%; background: linear-gradient(90deg,#FFB74D,#FF9800);
    width: 0%; transition: width .3s;
  }
  /* 录音中的红点呼吸动画 */
  .mic-btn.recording {
    background: #E53935 !important;
    animation: micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.6); }
    50%     { box-shadow: 0 0 0 12px rgba(229,57,53,0); }
  }
  .mic-btn.uploading { background: #FFA726 !important; }
  .mic-btn.uploading::after {
    content: ''; display: inline-block; width: 12px; height: 12px;
    border: 2px solid white; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-left: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 评分卡里的回放按钮 */
  .replay-row {
    display: flex; gap: 10px; justify-content: center; margin-top: 8px;
    flex-wrap: wrap;
  }
  .replay-row button {
    background: #FFF; border: 1px solid #FFB74D; color: #E65100;
    padding: 6px 14px; border-radius: 18px; font-size: 13px;
    cursor: pointer;
  }
  .replay-row button:active { background: #FFE0B2; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="icon-btn" onclick="location.href='../index.html'">←</button>
    <h1 id="title">Day 1</h1>
    <button class="icon-btn" onclick="skipOne()" title="跳过这一句">⏭️</button>
  </div>

  <div class="progress"><div id="progBar" style="width:0%"></div></div>
  <div style="text-align:center;font-size:13px;color:#999;margin-bottom:12px;">
    <span id="progText">0 / 0</span>
  </div>

  <!-- ============ 阶段一：通听整段对话 ============ -->
  <div id="listenPhase">
    <div class="card">
      <div style="font-weight:700;margin-bottom:6px;">📖 先听一遍整段对话</div>
      <div class="tiny" style="color:#999;margin-bottom:4px;">边听边看，听完点下面"开始跟读"</div>
      <div class="prefetch-bar"><div class="fill" id="prefetchFill"></div></div>
      <div class="tiny" id="prefetchText" style="color:#999;margin-bottom:6px;">准备中... 0 / 30</div>
      <div id="dialogList" class="dialog-list"></div>
    </div>
    <div class="card">
      <button class="big-btn" id="playAllBtn" onclick="playAll()" style="background:linear-gradient(135deg,#FFB74D,#FF9800);color:white;">▶️ 开始连播整段对话</button>
      <div class="listen-ctrl" style="margin-top:10px;">
        <button class="sub-btn" onclick="stopAll()">⏸️ 暂停</button>
        <button class="sub-btn" onclick="startPractice()">🎤 跳过通听 直接跟读</button>
      </div>
      <div class="tiny" id="listenStatus" style="text-align:center;color:#999;margin-top:8px;">点上面按钮开始播放</div>
    </div>
  </div>

  <!-- ============ 阶段二：逐句跟读 ============ -->
  <div id="practicePhase" style="display:none;">
    <div class="step-row">
      <div class="step" id="step1"><div class="dot">1</div>听</div>
      <div class="step" id="step2"><div class="dot">2</div>看</div>
      <div class="step" id="step3"><div class="dot">3</div>说</div>
      <div class="step" id="step4"><div class="dot">4</div>过</div>
    </div>

    <div class="card">
      <div id="speakerTag" class="speaker-tag">🎬</div>
      <div class="sentence-en" id="senEn">Loading...</div>
      <div class="sentence-zh hidden" id="senZh" onclick="revealZh()"></div>

      <div style="text-align:center;margin-top:8px;">
        <button class="sub-btn" style="display:inline-block;width:auto;padding:8px 16px;" onclick="playSentence()">🔊 再听一次</button>
      </div>

      <button class="mic-btn" id="micBtn" onclick="onMic()">🎤</button>
      <div class="mic-hint" id="micHint">点麦克风开始跟读</div>

      <div id="resultBox"></div>
    </div>

    <div class="card" style="text-align:center;">
      <div style="font-size:13px;color:#666;margin-bottom:8px;">说错了？</div>
      <button class="sub-btn" onclick="onMic()">🎤 再试一次</button>
      <div class="tiny" id="tryCount"></div>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script src="../data/daily-life.js"></script>
<script>
const TOTAL_DAYS = DAILY_LIFE.days.length;
const chosen = localStorage.getItem('chosen_day');
const dayId = chosen ? parseInt(chosen) : DE.Tracking.currentDayId(TOTAL_DAYS);
localStorage.removeItem('chosen_day');
const day = DAILY_LIFE.days.find(d => d.id === dayId) || DAILY_LIFE.days[0];
const sentences = day.sentences;
let curIdx = 0;
let tryNum = 0;
const MAX_TRY = 3;
const PASS_SCORE = 70;       // Whisper 比浏览器识别准；阈值微调
const MIN_LEN_RATIO = 0.6;
const RECORD_MAX_MS = 4000;  // 录音最长 4 秒，超时自动停

document.getElementById('title').textContent = `Day ${day.id} · ${day.theme}`;

// ============ 通用工具 ============
function getVoice(speaker) {
  return (DAILY_LIFE.defaultSpeakers || {})[speaker] || 'shimmer';
}
function getEmotion(type) {
  return (DAILY_LIFE.emotionMap || {})[type] || 'Speak naturally like a real person in daily life. ';
}
function getInstructions(speaker, type) {
  return ((DAILY_LIFE.speakerHints || {})[speaker] || '') + getEmotion(type);
}
function speakerIcon(sp) {
  return ({ mom:'👩', kid:'🧒', dad:'👨', teacher:'👩‍🏫', doctor:'🧑‍⚕️', grandma:'👵', grandpa:'👴', sister:'👧', brother:'👦', classmate:'🧒' })[sp] || '🎬';
}
function speakerName(sp) {
  return ({ mom:'妈妈', kid:'小朋友', dad:'爸爸', teacher:'老师', doctor:'医生', grandma:'奶奶', grandpa:'爷爷', sister:'姐姐', brother:'弟弟', classmate:'同学' })[sp] || '说话人';
}

// ============ 阶段一：通听整段 ============
function renderDialogList() {
  const wrap = document.getElementById('dialogList');
  wrap.innerHTML = '';
  sentences.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'dialog-line';
    row.id = 'dl_' + i;
    row.onclick = () => playOneInList(i);
    row.innerHTML = `
      <div class="role-icon">${speakerIcon(s.speaker)}</div>
      <div class="role-body">
        <div class="role-name">${speakerName(s.speaker)}</div>
        <div class="role-en">${s.en}</div>
        <div class="role-zh">${s.zh}</div>
      </div>`;
    wrap.appendChild(row);
  });
}

function markListenRow(i, cls) {
  document.querySelectorAll('.dialog-line').forEach(r => r.classList.remove('playing'));
  const row = document.getElementById('dl_' + i);
  if (!row) return;
  if (cls === 'playing') row.classList.add('playing');
  if (cls === 'done')    row.classList.add('done');
  if (cls === 'skipped') row.classList.add('skipped');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function playOneInList(i) {
  if (DE.TTS.playing) return;
  await DE.TTS.unlock();
  markListenRow(i, 'playing');
  try { await DE.TTS.playOne(sentences[i]); }
  catch (e) { console.warn('playOne err', e.message); }
  markListenRow(i, 'done');
}

async function playAll() {
  if (DE.TTS.playing) return;
  await DE.TTS.unlock();
  const status = document.getElementById('listenStatus');
  status.textContent = '🔊 正在连播...';
  document.getElementById('playAllBtn').disabled = true;
  await DE.TTS.playAll(
    sentences,
    (i, state) => markListenRow(i, state),
    () => {
      document.getElementById('playAllBtn').disabled = false;
      status.innerHTML = '✅ 整段播完了！点 <b>🎤 跳过通听 直接跟读</b> 进入练习';
    }
  );
}

function stopAll() {
  DE.TTS.stop();
  document.getElementById('playAllBtn').disabled = false;
  document.getElementById('listenStatus').textContent = '⏸️ 已暂停';
}

function startPractice() {
  stopAll();
  document.getElementById('listenPhase').style.display = 'none';
  document.getElementById('practicePhase').style.display = '';
  if (!DE.Recorder.isSupported()) {
    showMicWarning();
  }
  loadCurrent();
}

function showMicWarning() {
  const hint = document.getElementById('micHint');
  hint.innerHTML = '⚠️ 此设备无法录音，跟读会自动通过<br><span class="tiny">需要 iOS 14.3+ / 新版 Chrome</span>';
}

// ============ 后台预下载整段音频 ============
async function prefetchAll() {
  const fill = document.getElementById('prefetchFill');
  const text = document.getElementById('prefetchText');
  try {
    await DE.TTS.prefetchAll(sentences, (done, total) => {
      fill.style.width = (done / total * 100) + '%';
      text.textContent = done < total ? `准备中... ${done} / ${total}` : `✅ 全部 ${total} 句已就绪`;
    });
  } catch (e) {
    text.textContent = '⚠️ 预下载失败（可仍点连播，会按需下载）';
  }
}

// ============ 阶段二：逐句跟读 ============
function setStep(n) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  }
}

function updateProgress() {
  document.getElementById('progBar').style.width = (curIdx / sentences.length * 100) + '%';
  document.getElementById('progText').textContent = `${curIdx} / ${sentences.length}`;
}

async function loadCurrent() {
  if (curIdx >= sentences.length) return finishDay();
  const s = sentences[curIdx];
  tryNum = 0;
  document.getElementById('speakerTag').textContent = speakerIcon(s.speaker) + ' ' + speakerName(s.speaker);
  document.getElementById('senEn').textContent = s.en;
  const zh = document.getElementById('senZh');
  zh.textContent = s.zh;
  zh.classList.add('hidden');
  document.getElementById('resultBox').innerHTML = '';
  document.getElementById('tryCount').textContent = '';
  setMicUI('idle');
  setStep(1);
  updateProgress();
  await playSentence();
  setStep(2);
}

async function playSentence() {
  await DE.TTS.unlock();
  try { await DE.TTS.playOne(sentences[curIdx]); }
  catch (e) { console.warn('playSentence err', e.message); }
}

function revealZh() {
  document.getElementById('senZh').classList.remove('hidden');
  setStep(3);
}

// mic 按钮状态机：idle → recording → uploading → idle
let _recording = false;
let _recordTimer = null;

function setMicUI(state) {
  const btn = document.getElementById('micBtn');
  const hint = document.getElementById('micHint');
  btn.classList.remove('recording', 'uploading', 'listening');
  switch (state) {
    case 'recording':
      btn.classList.add('recording');
      btn.textContent = '⏹️';
      hint.textContent = '🔴 录音中... 再点一下停（4 秒自动停）';
      break;
    case 'uploading':
      btn.classList.add('uploading');
      btn.textContent = '🎤';
      hint.textContent = '⏳ 正在判分...';
      break;
    default:
      btn.textContent = '🎤';
      hint.textContent = '点麦克风开始跟读';
  }
}

async function onMic() {
  // 无录音支持时直接通过
  if (!DE.Recorder.isSupported()) {
    DE.Tracking.markDone(day.id, curIdx);
    setStep(4);
    setTimeout(next, 600);
    return;
  }

  // 第二次点：停止录音
  if (_recording) return stopRec();

  // 第一次点：开始录音
  await DE.TTS.unlock();   // 顺便解锁 audio，回放需要
  document.getElementById('senZh').classList.remove('hidden');
  setStep(3);
  document.getElementById('resultBox').innerHTML = '';
  try {
    await DE.Recorder.start();
  } catch (e) {
    showMicError(e.message);
    return;
  }
  _recording = true;
  setMicUI('recording');
  if (_recordTimer) clearTimeout(_recordTimer);
  _recordTimer = setTimeout(stopRec, RECORD_MAX_MS);
}

async function stopRec() {
  if (!_recording) return;
  _recording = false;
  if (_recordTimer) { clearTimeout(_recordTimer); _recordTimer = null; }
  setMicUI('uploading');
  let heard = '';
  let blob = null;
  try {
    blob = await DE.Recorder.stop();
  } catch (e) {
    console.warn('stop err', e);
  }
  try {
    if (blob) heard = await DE.Recorder.transcribe(blob);
  } catch (e) {
    console.warn('whisper err', e.message);
    handleNetFail();
    return;
  }
  setMicUI('idle');
  scoreAndShow(heard);
}

function showMicError(msg) {
  setMicUI('idle');
  document.getElementById('micHint').textContent = '⚠️ ' + msg;
}

function handleNetFail() {
  setMicUI('idle');
  document.getElementById('resultBox').innerHTML = `
    <div class="result pass">
      <div style="font-size:13px;opacity:.8;">😅 网络问题，给你过了</div>
    </div>`;
  DE.Tracking.markDone(day.id, curIdx);
  setStep(4);
  setTimeout(next, 1500);
}

function scoreAndShow(heard) {
  const s = sentences[curIdx];
  if (!heard || !heard.trim()) {
    showResult(0, 0, false, '(没听到声音)');
    tryNum++;
    document.getElementById('tryCount').textContent = `已尝试 ${tryNum}/${MAX_TRY} 次`;
    if (tryNum >= MAX_TRY) {
      setTimeout(() => { DE.Tracking.markDone(day.id, curIdx); next(); }, 1500);
    }
    return;
  }
  const { score, lenRatio, ok } = DE.Pronunciation.passed(s.en, heard, PASS_SCORE, MIN_LEN_RATIO);
  showResult(score, lenRatio, ok, heard);
  if (ok) {
    setStep(4);
    DE.Tracking.markDone(day.id, curIdx);
    setTimeout(next, 1500);
  } else {
    tryNum++;
    document.getElementById('tryCount').textContent = `已尝试 ${tryNum}/${MAX_TRY} 次`;
    if (tryNum >= MAX_TRY) {
      const box = document.getElementById('resultBox');
      box.innerHTML += '<div class="tiny" style="text-align:center;margin-top:8px;">已重试 3 次，2 秒后跳过</div>';
      setTimeout(() => { DE.Tracking.markDone(day.id, curIdx); next(); }, 2000);
    }
  }
}

function showResult(score, lenRatio, ok, heard) {
  const cls = ok ? 'pass' : 'fail';
  const emoji = ok ? '🎉' : (score >= 50 ? '💪' : '😅');
  const tip = ok ? '太棒了！' : (lenRatio < 0.6 ? '说短了，再完整一点' : '再清楚一点');
  const s = sentences[curIdx];
  const replayBtn = DE.Recorder.hasPlayback()
    ? '<button onclick="DE.Recorder.playback()">▶️ 听听刚才</button>'
    : '';
  document.getElementById('resultBox').innerHTML = `
    <div class="result ${cls}">
      <div style="font-size:13px;opacity:.8;">${emoji} ${tip}</div>
      <div class="score">${score}<span style="font-size:14px;">分</span></div>
      <div class="heard">你说: "${heard}"</div>
      <div class="heard" style="opacity:.6;">原句: "${s.en}"</div>
      <div class="replay-row">
        ${replayBtn}
        <button onclick="DE.TTS.playOne(sentences[curIdx])">🔊 听原句</button>
      </div>
    </div>`;
}

function next() {
  curIdx++;
  loadCurrent();
}

// 跳过：直接跳，不弹 confirm
function skipOne() {
  if (document.getElementById('practicePhase').style.display === 'none') {
    startPractice();
    return;
  }
  DE.Tracking.markDone(day.id, curIdx);
  next();
}

function finishDay() {
  const streak = DE.Tracking.completeDay(day.id);
  document.body.innerHTML = `
    <div class="wrap" style="text-align:center;padding-top:60px;">
      <div style="font-size:80px;">🏆</div>
      <h1 style="color:#E91E63;margin:16px 0;">完成 Day ${day.id}!</h1>
      <div style="font-size:18px;color:#666;margin-bottom:24px;">连续打卡 ${streak} 天</div>
      <button class="big-btn" onclick="location.href='../index.html'">回主页</button>
    </div>`;
}

// ============ 启动：先渲染对话脚本 + 后台预下载，等用户点 ▶️ ============
renderDialogList();
document.getElementById('progText').textContent = `0 / ${sentences.length}`;
prefetchAll();  // 进页面就开始后台下载，不阻塞 UI
</script>
</body>
</html>
