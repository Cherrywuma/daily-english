<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>今日打卡</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* 完整对话脚本区域 */
  .dialog-list { max-height: 50vh; overflow-y: auto; padding: 8px 4px; }
  .dialog-line {
    display: flex; gap: 8px; padding: 8px 10px; margin: 6px 0;
    border-radius: 12px; background: #FFF5E1;
    transition: background .2s;
  }
  .dialog-line.playing { background: linear-gradient(135deg, #FFE082, #FFCA28); }
  .dialog-line.done    { opacity: .55; }
  .dialog-line .role-icon { font-size: 22px; }
  .dialog-line .role-body { flex: 1; }
  .dialog-line .role-name { font-size: 11px; color: #888; }
  .dialog-line .role-en   { font-size: 14px; font-weight: 600; color: #333; }
  .dialog-line .role-zh   { font-size: 12px; color: #666; margin-top: 2px; }
  .listen-ctrl {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap; padding: 6px 0;
  }
  .listen-ctrl .sub-btn { width: auto; padding: 8px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="icon-btn" onclick="location.href='../index.html'">←</button>
    <h1 id="title">Day 1</h1>
    <button class="icon-btn" onclick="skipOne()" title="跳过这一句">⏭️</button>
  </div>

  <div class="progress"><div id="progBar" style="width:0%"></div></div>
  <div style="text-align:center;font-size:13px;color:#999;margin-bottom:12px;">
    <span id="progText">0 / 0</span>
  </div>

  <!-- ============ 阶段一：通听整段对话 ============ -->
  <div id="listenPhase">
    <div class="card">
      <div style="font-weight:700;margin-bottom:6px;">📖 先听一遍整段对话</div>
      <div class="tiny" style="color:#999;margin-bottom:8px;">边听边看，听完点下面"开始跟读"</div>
      <div id="dialogList" class="dialog-list"></div>
    </div>
    <div class="card">
      <button class="big-btn" id="playAllBtn" onclick="playAll()" style="background:linear-gradient(135deg,#FFB74D,#FF9800);color:white;">▶️ 开始连播整段对话</button>
      <div class="listen-ctrl" style="margin-top:10px;">
        <button class="sub-btn" onclick="stopAll()">⏸️ 暂停</button>
        <button class="sub-btn" onclick="startPractice()">🎤 跳过通听 直接跟读</button>
      </div>
      <div class="tiny" id="listenStatus" style="text-align:center;color:#999;margin-top:8px;">点上面按钮开始播放（浏览器要求手动点一次才能放声音）</div>
    </div>
  </div>

  <!-- ============ 阶段二：逐句跟读 ============ -->
  <div id="practicePhase" style="display:none;">
    <div class="step-row">
      <div class="step" id="step1"><div class="dot">1</div>听</div>
      <div class="step" id="step2"><div class="dot">2</div>看</div>
      <div class="step" id="step3"><div class="dot">3</div>说</div>
      <div class="step" id="step4"><div class="dot">4</div>过</div>
    </div>

    <div class="card">
      <div id="speakerTag" class="speaker-tag">🎬</div>
      <div class="sentence-en" id="senEn">Loading...</div>
      <div class="sentence-zh hidden" id="senZh" onclick="revealZh()"></div>

      <div style="text-align:center;margin-top:8px;">
        <button class="sub-btn" style="display:inline-block;width:auto;padding:8px 16px;" onclick="playSentence()">🔊 再听一次</button>
      </div>

      <button class="mic-btn" id="micBtn" onclick="onMic()">🎤</button>
      <div class="mic-hint" id="micHint">点麦克风跟读</div>

      <div id="resultBox"></div>
    </div>

    <div class="card" style="text-align:center;">
      <div style="font-size:13px;color:#666;margin-bottom:8px;">说错了？</div>
      <button class="sub-btn" onclick="onMic()">🎤 再试一次</button>
      <div class="tiny" id="tryCount"></div>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script src="../data/daily-life.js"></script>
<script>
const TOTAL_DAYS = DAILY_LIFE.days.length;
const chosen = localStorage.getItem('chosen_day');
const dayId = chosen ? parseInt(chosen) : DE.Tracking.currentDayId(TOTAL_DAYS);
localStorage.removeItem('chosen_day');
const day = DAILY_LIFE.days.find(d => d.id === dayId) || DAILY_LIFE.days[0];
const sentences = day.sentences;
let curIdx = 0;
let tryNum = 0;
const MAX_TRY = 3;
const PASS_SCORE = 75;
const MIN_LEN_RATIO = 0.7;

let listenPlaying = false;  // 通听是否在自动播放中
let listenIdx = 0;          // 通听播到第几句

document.getElementById('title').textContent = `Day ${day.id} · ${day.theme}`;

// ============ 通用工具 ============
function getVoice(speaker) {
  return (DAILY_LIFE.defaultSpeakers || {})[speaker] || 'shimmer';
}
function getEmotion(type) {
  return (DAILY_LIFE.emotionMap || {})[type] || 'Speak naturally like a real person in daily life.';
}
function getInstructions(speaker, type) {
  return ((DAILY_LIFE.speakerHints || {})[speaker] || '') + getEmotion(type);
}
function getPitch(speaker) {
  return (DAILY_LIFE.speakerPitch || {})[speaker] || 1.0;
}
function speakerIcon(sp) {
  return ({ mom:'👩', kid:'🧒', dad:'👨', teacher:'👩‍🏫', doctor:'🧑‍⚕️', grandma:'👵', grandpa:'👴', sister:'👧', brother:'👦', classmate:'🧒' })[sp] || '🎬';
}
function speakerName(sp) {
  return ({ mom:'妈妈', kid:'小朋友', dad:'爸爸', teacher:'老师', doctor:'医生', grandma:'奶奶', grandpa:'爷爷', sister:'姐姐', brother:'弟弟', classmate:'同学' })[sp] || '说话人';
}
async function speakLine(s) {
  return DE.TTS.speak(s.en, getVoice(s.speaker), getInstructions(s.speaker, s.type), { pitch: getPitch(s.speaker) });
}

// ============ 阶段一：通听整段 ============
function renderDialogList() {
  const wrap = document.getElementById('dialogList');
  wrap.innerHTML = '';
  sentences.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'dialog-line';
    row.id = 'dl_' + i;
    row.onclick = () => playOneInList(i);
    row.innerHTML = `
      <div class="role-icon">${speakerIcon(s.speaker)}</div>
      <div class="role-body">
        <div class="role-name">${speakerName(s.speaker)}</div>
        <div class="role-en">${s.en}</div>
        <div class="role-zh">${s.zh}</div>
      </div>`;
    wrap.appendChild(row);
  });
}

function markListenRow(i, cls) {
  document.querySelectorAll('.dialog-line').forEach(r => r.classList.remove('playing'));
  const row = document.getElementById('dl_' + i);
  if (row) {
    if (cls === 'playing') row.classList.add('playing');
    if (cls === 'done') row.classList.add('done');
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

async function playOneInList(i) {
  if (listenPlaying) return;  // 自动连播中点单句无效
  markListenRow(i, 'playing');
  await speakLine(sentences[i]);
  markListenRow(i, 'done');
}

async function playAll() {
  if (listenPlaying) return;
  listenPlaying = true;
  document.getElementById('listenStatus').textContent = '🔊 正在连播...';
  document.getElementById('playAllBtn').disabled = true;
  for (let i = listenIdx; i < sentences.length; i++) {
    if (!listenPlaying) break;
    listenIdx = i;
    markListenRow(i, 'playing');
    await speakLine(sentences[i]);
    if (!listenPlaying) break;
    document.getElementById('dl_' + i).classList.add('done');
    document.getElementById('dl_' + i).classList.remove('playing');
    // 句子之间留一点停顿，像真人对话
    await new Promise(r => setTimeout(r, 350));
  }
  listenPlaying = false;
  document.getElementById('playAllBtn').disabled = false;
  if (listenIdx >= sentences.length - 1) {
    document.getElementById('listenStatus').innerHTML = '✅ 整段播完了！点 <b>🎤 开始跟读</b> 进入练习';
    listenIdx = 0;
  } else {
    document.getElementById('listenStatus').textContent = '⏸️ 已暂停，可继续';
  }
}

function stopAll() {
  listenPlaying = false;
  DE.TTS.stop();
  document.getElementById('listenStatus').textContent = '⏸️ 已暂停';
}

function startPractice() {
  stopAll();
  document.getElementById('listenPhase').style.display = 'none';
  document.getElementById('practicePhase').style.display = '';
  loadCurrent();
}

// ============ 阶段二：逐句跟读 ============
function setStep(n) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  }
}

function updateProgress() {
  document.getElementById('progBar').style.width = (curIdx / sentences.length * 100) + '%';
  document.getElementById('progText').textContent = `${curIdx} / ${sentences.length}`;
}

async function loadCurrent() {
  if (curIdx >= sentences.length) return finishDay();
  const s = sentences[curIdx];
  tryNum = 0;
  document.getElementById('speakerTag').textContent = speakerIcon(s.speaker) + ' ' + speakerName(s.speaker);
  document.getElementById('senEn').textContent = s.en;
  const zh = document.getElementById('senZh');
  zh.textContent = s.zh;
  zh.classList.add('hidden');
  document.getElementById('resultBox').innerHTML = '';
  document.getElementById('tryCount').textContent = '';
  document.getElementById('micHint').textContent = '点麦克风跟读';
  setStep(1);
  updateProgress();
  await playSentence();
  setStep(2);
}

async function playSentence() {
  await speakLine(sentences[curIdx]);
}

function revealZh() {
  document.getElementById('senZh').classList.remove('hidden');
  setStep(3);
}

function onMic() {
  const s = sentences[curIdx];
  document.getElementById('senZh').classList.remove('hidden');
  setStep(3);
  const btn = document.getElementById('micBtn');
  btn.classList.add('listening');
  document.getElementById('micHint').textContent = '🎙️ 听你说...';
  document.getElementById('resultBox').innerHTML = '';
  DE.Recognition.start(
    (heard) => {
      btn.classList.remove('listening');
      const { score, lenRatio, ok } = DE.Pronunciation.passed(s.en, heard, PASS_SCORE, MIN_LEN_RATIO);
      showResult(score, lenRatio, ok, heard);
      if (ok) {
        setStep(4);
        DE.Tracking.markDone(day.id, curIdx);
        setTimeout(next, 1200);
      } else {
        tryNum++;
        document.getElementById('tryCount').textContent = `已尝试 ${tryNum}/${MAX_TRY} 次`;
        if (tryNum >= MAX_TRY) {
          document.getElementById('resultBox').innerHTML += '<div class="tiny" style="text-align:center;margin-top:8px;">已重试 3 次，2 秒后跳过</div>';
          setTimeout(() => { DE.Tracking.markDone(day.id, curIdx); next(); }, 2000);
        }
      }
    },
    (err) => {
      btn.classList.remove('listening');
      document.getElementById('micHint').textContent = '⚠️ ' + err;
    }
  );
}

function showResult(score, lenRatio, ok, heard) {
  const cls = ok ? 'pass' : 'fail';
  const emoji = ok ? '🎉' : (score >= 50 ? '💪' : '😅');
  const tip = ok ? '太棒了！' : (lenRatio < 0.7 ? '说短了，再完整一点' : '再清楚一点');
  document.getElementById('resultBox').innerHTML = `
    <div class="result ${cls}">
      <div style="font-size:13px;opacity:.8;">${emoji} ${tip}</div>
      <div class="score">${score}<span style="font-size:14px;">分</span></div>
      <div class="heard">你说: "${heard}"</div>
    </div>`;
}

function next() {
  curIdx++;
  loadCurrent();
}

// 跳过：直接跳，不弹 confirm
function skipOne() {
  if (document.getElementById('practicePhase').style.display === 'none') {
    // 通听阶段下点跳过：直接进入跟读
    startPractice();
    return;
  }
  DE.Tracking.markDone(day.id, curIdx);
  next();
}

function finishDay() {
  const streak = DE.Tracking.completeDay(day.id);
  document.body.innerHTML = `
    <div class="wrap" style="text-align:center;padding-top:60px;">
      <div style="font-size:80px;">🏆</div>
      <h1 style="color:#E91E63;margin:16px 0;">完成 Day ${day.id}!</h1>
      <div style="font-size:18px;color:#666;margin-bottom:24px;">连续打卡 ${streak} 天</div>
      <button class="big-btn" onclick="location.href='../index.html'">回主页</button>
    </div>`;
}

// ============ 启动：先渲染对话脚本，等用户点 ▶️ ============
renderDialogList();
// 不自动播放：浏览器禁止页面自动播放音频，必须用户点击触发
</script>
</body>
</html>
