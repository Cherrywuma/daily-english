<script>
async function testTTS() {
  const msg = document.getElementById('cfgMsg');
  msg.textContent = '测试中...';

  try {
    if (!DE.Config.isReady()) {
      msg.innerHTML = '<span class="err-msg">⚠️ 请先填写 Worker 地址和 App 密码</span>';
      return;
    }

    await DE.TTS.unlock();

    await DE.TTS.playOne({
      en: "Mom, five more minutes!",
      zh: "妈妈，再睡五分钟！",
      speaker: "brother",
      type: "whine"
    });

    msg.innerHTML = '<span class="ok-msg">✅ 听到弟弟声音就是成功</span>';
  } catch (e) {
    msg.innerHTML = `<span class="err-msg">⚠️ ${e.message}</span>`;
  }
}
</script>
