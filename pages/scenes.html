<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>生活场景库</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { background: #f8fafc; }
  .phase-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .phase-switch button {
    border: 1px solid #d8dee9;
    border-radius: 12px;
    background: #fff;
    color: #475569;
    padding: 12px 8px;
    font-weight: 900;
  }
  .phase-switch button.active {
    border-color: #fb923c;
    background: #fff7ed;
    color: #c2410c;
  }
  .scene-toolbar {
    position: sticky;
    top: 0;
    z-index: 3;
    background: rgba(248,250,252,.96);
    padding: 8px 0 12px;
  }
  .search {
    width: 100%;
    border: 1px solid #d8dee9;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 16px;
    outline: none;
    background: white;
  }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 0 2px;
  }
  .tabs button {
    flex: 0 0 auto;
    border: 1px solid #d8dee9;
    border-radius: 999px;
    background: white;
    padding: 9px 12px;
    color: #475569;
    font-weight: 700;
  }
  .tabs button.active {
    background: #fff7ed;
    border-color: #fb923c;
    color: #c2410c;
  }
  .scene-card {
    background: white;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 6px 18px rgba(15,23,42,.06);
  }
  .scene-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
  }
  .scene-title {
    font-size: 18px;
    font-weight: 900;
    color: #111827;
    line-height: 1.25;
  }
  .scene-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
    color: #64748b;
    font-size: 12px;
  }
  .pill {
    border-radius: 999px;
    background: #f1f5f9;
    padding: 3px 8px;
  }
  .pill.mode { background: #ecfeff; color: #0e7490; font-weight: 800; }
  .scene-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .scene-actions button {
    border: 1px solid #ffd6a8;
    background: #fff;
    color: #c2410c;
    border-radius: 10px;
    padding: 8px 10px;
    font-weight: 800;
  }
  .scene-lines {
    display: none;
    margin-top: 12px;
    border-top: 1px solid #edf2f7;
    padding-top: 8px;
  }
  .scene-card.open .scene-lines { display: block; }
  .line {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .role {
    font-size: 12px;
    font-weight: 900;
  }
  .role.mom { color: #b45309; }
  .role.dad { color: #1d4ed8; }
  .role.sister { color: #be185d; }
  .role.brother { color: #047857; }
  .role.grandma, .role.grandpa { color: #7c3aed; }
  .en {
    font-size: 15px;
    font-weight: 800;
    color: #1f2937;
    line-height: 1.35;
  }
  .zh {
    margin-top: 2px;
    color: #64748b;
    font-size: 13px;
    line-height: 1.4;
  }
  .empty {
    text-align: center;
    color: #64748b;
    padding: 40px 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="icon-btn" onclick="location.href='../index.html?v=20260524-scenes2'">←</button>
    <h1>生活场景库</h1>
    <button class="icon-btn" onclick="render()">刷新</button>
  </div>

  <div class="scene-toolbar">
    <div class="phase-switch">
      <button id="phase1Btn" onclick="setPhase('phase1')">日常对话</button>
      <button id="phase2Btn" onclick="setPhase('phase2')">妈妈语音</button>
    </div>
    <input class="search" id="search" placeholder="搜索：电饭锅、起床、刷牙..." oninput="render()">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="tiny" id="summary" style="margin:4px 0 12px;"></div>
  <div id="list"></div>
</div>

<script src="../js/core.js?v=20260524-scenes2"></script>
<script src="../data/scenes.js?v=20260524-scenes2"></script>
<script src="../data/scenes2.js?v=20260524-scenes2"></script>
<script>
let activePhase = 'phase1';
let currentCategory = 'all';
let playing = false;
let currentAudio = null;

const roleNames = {
  mom: '妈妈',
  dad: '爸爸',
  sister: '姐姐',
  brother: '弟弟',
  teacher: '老师',
  doctor: '医生',
  grandma: '奶奶',
  grandpa: '爷爷',
  classmate: '同学',
  kid: '孩子'
};

const fallbackVoices = {
  mom: 'shimmer',
  dad: 'onyx',
  sister: 'coral',
  brother: 'echo',
  grandma: 'nova',
  grandpa: 'onyx',
  teacher: 'sage',
  kid: 'echo'
};

function activeLibrary() {
  if (activePhase === 'phase2') {
    const cats = {};
    (window.CATEGORIES2 || []).forEach((cat) => { cats[cat.id] = cat.label; });
    return {
      phase: 'phase2',
      label: '妈妈语音',
      scenes: window.SCENES2 || [],
      categories: cats,
      defaultSpeakers: window.DEFAULT_SPEAKERS2 || {}
    };
  }
  return {
    phase: 'phase1',
    label: '日常对话',
    scenes: (window.SCENES && window.SCENES.scenes) || [],
    categories: (window.SCENES && window.SCENES.categories) || {},
    defaultSpeakers: (window.SCENES && window.SCENES.defaultSpeakers) || {}
  };
}

function setPhase(phase) {
  activePhase = phase;
  currentCategory = 'all';
  document.getElementById('search').value = '';
  render();
}

function categories() {
  return Object.entries(activeLibrary().categories || {});
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const items = [['all', '全部'], ...categories()];
  tabs.innerHTML = items.map(([key, label]) =>
    `<button class="${key === currentCategory ? 'active' : ''}" onclick="setCategory('${key}')">${label}</button>`
  ).join('');
}

function setCategory(category) {
  currentCategory = category;
  render();
}

function filteredScenes() {
  const lib = activeLibrary();
  const q = document.getElementById('search').value.trim().toLowerCase();
  return lib.scenes.filter((scene) => {
    if (currentCategory !== 'all' && scene.category !== currentCategory) return false;
    if (!q) return true;
    const text = [
      scene.title,
      scene.category,
      ...(scene.tags || []),
      ...(scene.sentences || []).flatMap((s) => [s.en, s.zh, s.speaker])
    ].join(' ').toLowerCase();
    return text.includes(q);
  });
}

function render() {
  const lib = activeLibrary();
  document.getElementById('phase1Btn').classList.toggle('active', activePhase === 'phase1');
  document.getElementById('phase2Btn').classList.toggle('active', activePhase === 'phase2');
  renderTabs();
  const scenes = filteredScenes();
  document.getElementById('summary').textContent =
    `${lib.label}: 共 ${lib.scenes.length} 个场景，当前显示 ${scenes.length} 个`;
  const list = document.getElementById('list');
  if (!scenes.length) {
    list.innerHTML = '<div class="empty">没有找到这个场景</div>';
    return;
  }
  list.innerHTML = scenes.slice(0, 140).map(sceneCard).join('');
}

function modeLabel(scene) {
  if (activePhase !== 'phase2') return '';
  if (scene.mode === 'duo') return '💬 母子对话';
  return '🗣️ 妈妈独白';
}

function sceneCard(scene) {
  const lib = activeLibrary();
  const category = (lib.categories || {})[scene.category] || scene.category || '生活场景';
  const tags = (scene.tags || []).map((tag) => `#${tag}`).join(' ');
  const mode = modeLabel(scene);
  return `<div class="scene-card" id="scene_${activePhase}_${scene.id}">
    <div class="scene-head">
      <div>
        <div class="scene-title">#${scene.id} ${scene.title}</div>
        <div class="scene-meta">
          ${mode ? `<span class="pill mode">${mode}</span>` : ''}
          <span class="pill">${category}</span>
          <span class="pill">${(scene.sentences || []).length} 句</span>
          ${tags ? `<span class="pill">${tags}</span>` : ''}
        </div>
      </div>
      <div class="scene-actions">
        <button onclick="toggleScene(${scene.id})">展开</button>
        <button onclick="playScene(${scene.id})">播放</button>
      </div>
    </div>
    <div class="scene-lines">
      ${(scene.sentences || []).map((s) => `<div class="line">
        <div class="role ${s.speaker || ''}">${roleNames[s.speaker] || s.speaker || ''}</div>
        <div>
          <div class="en">${s.en}</div>
          <div class="zh">${s.zh}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function toggleScene(id) {
  const card = document.getElementById(`scene_${activePhase}_${id}`);
  if (!card) return;
  card.classList.toggle('open');
}

function userVoiceFor(speaker) {
  if (!speaker) return '';
  const phaseKey = `scene_voice_${activePhase}_${speaker}`;
  const genericKey = `scene_voice_${speaker}`;
  try {
    return localStorage.getItem(phaseKey) || localStorage.getItem(genericKey) || '';
  } catch {
    return '';
  }
}

function voiceFor(speaker) {
  const lib = activeLibrary();
  return userVoiceFor(speaker)
    || (lib.defaultSpeakers && lib.defaultSpeakers[speaker])
    || fallbackVoices[speaker]
    || 'shimmer';
}

function instructionsFor(sentence) {
  if (activePhase === 'phase2') return '';
  return '';
}

async function speakSentence(sentence) {
  const voice = voiceFor(sentence.speaker);
  if (!DE.Config || !DE.Config.isReady()) throw new Error('??????? Worker ?????');
  const resp = await fetch(DE.Config.workerUrl.replace(/\/$/, '') + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text: sentence.en,
      voice_id: voice,
      voice,
      emotion: sentence.type || 'neutral',
      password: DE.Config.password,
    }),
  });
  if (!resp.ok) {
    const detail = await resp.text();
    throw new Error('TTS ' + resp.status + ': ' + detail.slice(0, 120));
  }
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  await new Promise((resolve) => {
    const audio = new Audio(url);
    currentAudio = audio;
    audio.onended = resolve;
    audio.onerror = resolve;
    audio.play().catch(resolve);
  });
  URL.revokeObjectURL(url);
  currentAudio = null;
}

async function playScene(id) {
  if (playing) {
    try { if (currentAudio) currentAudio.pause(); } catch {}
    try { if (DE.TTS && DE.TTS.stop) DE.TTS.stop(); } catch {}
    playing = false;
    return;
  }
  const lib = activeLibrary();
  const scene = lib.scenes.find((s) => s.id === id);
  if (!scene) return;
  const card = document.getElementById(`scene_${activePhase}_${id}`);
  if (card) card.classList.add('open');
  if (!DE.Config.isReady()) {
    alert('请先在首页设置 Worker 地址和密码，才能播放声音。');
    return;
  }
  playing = true;
  try {
    for (const sentence of scene.sentences || []) {
      if (!playing) break;
      await speakSentence(sentence);
      await new Promise((resolve) => setTimeout(resolve, 80));
    }
  } catch (e) {
    alert('播放失败：' + e.message);
  } finally {
    playing = false;
  }
}

render();
</script>
</body>
</html>
